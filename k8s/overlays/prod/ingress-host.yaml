apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sequel
spec:
  rules:
    - host: sequel.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sequel-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sequel-web
                port:
                  name: http
