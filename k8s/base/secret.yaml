apiVersion: v1
kind: Secret
metadata:
  name: sequel-secrets
type: Opaque
stringData:
  POSTGRES_SUPERUSER: postgres
  POSTGRES_SUPERUSER_PASSWORD: change-me-superuser
  POSTGRES_APP_PASSWORD: change-me-app
  POSTGRES_SANDBOX_ADMIN_PASSWORD: change-me-sandbox-admin
  POSTGRES_SANDBOX_READER_PASSWORD: change-me-sandbox-reader
  POSTGRES_SANDBOX_WRITER_PASSWORD: change-me-sandbox-writer
  POSTGRES_SUPERUSER_URL: postgres://postgres:change-me-superuser@sequel-postgres:5432/postgres
  DATABASE_URL: postgres://sequel_app:change-me-app@sequel-postgres:5432/sequel_app
  SANDBOX_DATABASE_URL: postgres://sequel_sandbox_admin:change-me-sandbox-admin@sequel-postgres:5432/sequel_sandbox
  SANDBOX_READER_DATABASE_URL: postgres://sequel_sandbox_reader:change-me-sandbox-reader@sequel-postgres:5432/sequel_sandbox
  SANDBOX_WRITER_DATABASE_URL: postgres://sequel_sandbox_writer:change-me-sandbox-writer@sequel-postgres:5432/sequel_sandbox
  LLM_API_KEY: ""
