apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sequel
labels:
  - pairs:
      app.kubernetes.io/part-of: sequel
    includeSelectors: false
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - redis.yaml
  - setup-job.yaml
  - api.yaml
  - worker.yaml
  - web.yaml
  - ingress.yaml
images:
  - name: sequel-api
    newTag: latest
  - name: sequel-worker
    newTag: latest
  - name: sequel-web
    newTag: latest
  - name: sequel-cli
    newTag: latest
