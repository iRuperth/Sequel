apiVersion: v1
kind: Service
metadata:
  name: sequel-api
spec:
  selector:
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 4040
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sequel-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: sequel-api
          ports:
            - name: http
              containerPort: 4040
          envFrom:
            - configMapRef:
                name: sequel-config
            - secretRef:
                name: sequel-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
