apiVersion: batch/v1
kind: Job
metadata:
  name: sequel-setup
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: setup
    spec:
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: sequel-cli
          args: ["setup"]
          envFrom:
            - configMapRef:
                name: sequel-config
            - secretRef:
                name: sequel-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
