apiVersion: v1
kind: Service
metadata:
  name: sequel-web
spec:
  selector:
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 3030
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sequel-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: sequel-web
          ports:
            - name: http
              containerPort: 3030
          envFrom:
            - configMapRef:
                name: sequel-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
