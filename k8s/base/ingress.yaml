apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sequel
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
spec:
  ingressClassName: nginx
  rules:
    - host: sequel.localhost
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sequel-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sequel-web
                port:
                  name: http
